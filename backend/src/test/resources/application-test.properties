# Test Configuration for CI/CD
spring.application.name=cropadvisory

# Database - will be overridden by environment variables in CI
spring.datasource.url=jdbc:postgresql://localhost:5432/crop_advisory_test
spring.datasource.username=postgres
spring.datasource.password=test_password
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# JWT - test values
app.jwt.secret=test_secret_key_for_unit_tests_minimum_256_bits_required_for_hs256
app.jwt.expiration-ms=3600000

# CORS - test config
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Server
server.port=0

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Logging - quieter for tests
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.college.cropadvisory=INFO
