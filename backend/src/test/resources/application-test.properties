# Test Configuration - self-contained, no external database required
spring.application.name=cropadvisory

# H2 in-memory database: the whole context (including CropadvisoryApplicationTests)
# boots without a PostgreSQL server. Tests that need real-Postgres behaviour
# (e.g. dialect-specific SQL) should use Testcontainers instead.
spring.datasource.url=jdbc:h2:mem:cropadvisory_test;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT - test values
app.jwt.secret=test_secret_key_for_unit_tests_minimum_256_bits_required_for_hs256
app.jwt.expiration-ms=3600000

# CORS - test config
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Server
server.port=0

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Logging - quieter for tests
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.college.cropadvisory=INFO
