spring.application.name=cropadvisory

# Server port (Render automatically provides the PORT environment variable)
server.port=${PORT:8080}

# Database (Render PostgreSQL or local fallback)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crop_advisory}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:password123}}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT
app.jwt.secret=${JWT_SECRET:${APP_JWT_SECRET:change_me_to_a_secure_random_string_at_least_256_bits_long}}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS allowed origins (comma-separated)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Bootstrap admin account. AdminSeeder creates this user on startup, but only when both values
# are set and no admin exists yet. Leave blank to disable.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Actuator health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

logging.level.org.springframework.web=INFO
