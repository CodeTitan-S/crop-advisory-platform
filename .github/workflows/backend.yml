name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    # No database service needed: the test profile uses an in-memory H2 database
    # (backend/src/test/resources/application-test.properties), so `./mvnw test`
    # is fully self-contained.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Run unit tests
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw test

      - name: Build application
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw clean package -DskipTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/
          retention-days: 7

      # The >=40% service-layer gate itself is enforced inside `./mvnw test` by the
      # jacoco:check execution in pom.xml; this only surfaces the number in the log.
      - name: Show service-layer coverage
        if: always()
        working-directory: ./backend
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F, '$2=="com.college.cropadvisory.service" {m+=$8; c+=$9} END {t=m+c; if (t>0) printf "Service-layer line coverage: %.1f%% (required: >=40%%)\n", (c*100)/t; else print "No service classes measured"}' "$CSV"
          else
            echo "::warning::No JaCoCo data found - coverage was not measured"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  deploy:
    name: Deploy Backend
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && ([ "${{ needs.deploy.result }}" == "success" ] || [ "${{ needs.deploy.result }}" == "skipped" ]); then
            echo "✅ Backend build, tests, and deployment passed successfully!"
          else
            echo "❌ Backend build, tests, or deployment failed"
            exit 1
          fi
