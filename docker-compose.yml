version: '3.8'

services:
  db:
    image: postgres:15
    container_name: crop_advisory_db
    environment:
      POSTGRES_DB: crop_advisory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - crop_advisory_data:/var/lib/postgresql/data

volumes:
  crop_advisory_data: