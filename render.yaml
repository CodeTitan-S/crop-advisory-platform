services:
  - type: web
    name: cropadvisory-backend
    runtime: java
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/cropadvisory-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: FRONTEND_URL
        value: https://your-frontend.onrender.com,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: DB_URL
        fromDatabase:
          name: cropadvisory-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: cropadvisory-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cropadvisory-db
          property: password

databases:
  - name: cropadvisory-db
    region: oregon
    plan: free
    databaseName: crop_advisory
    user: postgres
