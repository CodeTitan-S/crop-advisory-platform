services:
  - type: web
    name: cropadvisory-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FRONTEND_URL
        value: https://crop-advisory-platform.vercel.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: "false"
      # sync: false keeps the value out of the repository. Set both in the Render
      # dashboard; until then the admin bootstrap is skipped.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cropadvisory-db
          property: connectionString

databases:
  - name: cropadvisory-db
    region: oregon
    plan: free
    databaseName: crop_advisory

