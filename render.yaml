services:
  - type: web
    name: cropadvisory-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FRONTEND_URL
        value: https://crop-advisory-platform.vercel.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: cropadvisory-db
          property: connectionString

databases:
  - name: cropadvisory-db
    region: oregon
    plan: free
    databaseName: crop_advisory

