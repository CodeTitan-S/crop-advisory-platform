services:
  - type: web
    name: cropadvisory-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FRONTEND_URL
        value: https://crop-advisory-platform.vercel.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: "false"
      # sync: false keeps the value out of the repository. Set both in the Render
      # dashboard; until then the admin bootstrap is skipped.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Set manually in the Render dashboard to the Internal Database URL of
      # cropadvisory-db-new. `fromDatabase` wiring was removed because the original
      # cropadvisory-db (free tier) expired after 90 days and the replacement was
      # created from the dashboard, which a blueprint cannot auto-wire.
      # NOTE: removing the `databases:` block below un-manages the (expired)
      # cropadvisory-db resource; nothing else references it.
      - key: DATABASE_URL
        sync: false
